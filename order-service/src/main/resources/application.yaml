server:
  port: 8081

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

spring:
  application:
    name: order-service
  cloud:
    config:
      enabled: false
    openfeign:
     oauth2:
       enabled: true
       clientRegistrationId: okta
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:5432/${SPRING_DATASOURCE_DATABASE:example_database}?currentSchema=${SPRING_DATASOURCE_SCHEMA:micro_project}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${0KTA_ISSUER}
      client:
        registration:
          okta:
            provider: okta
            scope: internal
            authorization-grant-type: client_credentials
            client-id: ${0KTA_CLIENT_ID}
            client-secret: ${0KTA_CLIENT_SECRET}
        provider:
          okta:
            issuer-uri: ${0KTA_ISSUER}

logging:
  level:
    root: ERROR
    org.example: INFO
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.cloud.openfeign: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      payment-service:
        event-consumer-buffer-size: 10
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
      product-service:
        event-consumer-buffer-size: 10
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED