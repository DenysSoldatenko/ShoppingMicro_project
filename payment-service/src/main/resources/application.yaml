server:
  port: 8082

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:5432/${SPRING_DATASOURCE_DATABASE:example_database}?currentSchema=${SPRING_DATASOURCE_SCHEMA:micro_project}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    config:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_SERVER_HOST:localhost}:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${random.uuid}

logging:
  level:
    root: ERROR
    org.example: INFO
    org.springframework.boot: WARN
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

okta:
  oauth2:
    issuer: ${0KTA_ISSUER}
    audience: api://default