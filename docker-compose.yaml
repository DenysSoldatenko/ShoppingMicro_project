networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    networks:
      - app-network
    ports:
      - "8761:8761"
    environment:
      EUREKA_SERVER_HOST: ${SERVER_HOST}

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    networks:
      - app-network
    depends_on:
      - redis
      - eureka-server
    env_file:
      - .env
    ports:
      - "9090:9090"
    environment:
      EUREKA_SERVER_HOST: ${SERVER_HOST}
      0KTA_ISSUER: ${ISSUER}
      0KTA_CLIENT_ID: ${CLIENT_ID}
      0KTA_CLIENT_SECRET: ${CLIENT_SECRET}

  product-service:
    build: ./product-service
    container_name: product-service
    networks:
      - app-network
    depends_on:
      - postgres
      - eureka-server
      - gateway-service
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_HOST: ${SERVER_HOST}
      SPRING_DATASOURCE_HOST: ${DATASOURCE_HOST}
      0KTA_ISSUER: ${ISSUER}

  payment-service:
    build: ./payment-service
    container_name: payment-service
    networks:
      - app-network
    depends_on:
      - postgres
      - eureka-server
      - gateway-service
    env_file:
      - .env
    ports:
      - "8082:8082"
    environment:
      EUREKA_SERVER_HOST: ${SERVER_HOST}
      SPRING_DATASOURCE_HOST: ${DATASOURCE_HOST}
      0KTA_ISSUER: ${ISSUER}

  order-service:
    build: ./order-service
    container_name: order-service
    networks:
      - app-network
    depends_on:
      - postgres
      - eureka-server
      - gateway-service
      - product-service
      - payment-service
    env_file:
      - .env
    ports:
      - "8081:8081"
    environment:
      EUREKA_SERVER_HOST: ${SERVER_HOST}
      SPRING_DATASOURCE_HOST: ${DATASOURCE_HOST}
      0KTA_ISSUER: ${ISSUER}
      0KTA_CLIENT_ID: ${CLIENT_ID}
      0KTA_CLIENT_SECRET: ${CLIENT_SECRET}

  postgres:
    image: postgres:15.1-alpine
    container_name: postgres
    networks:
      - app-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
      POSTGRES_DB: ${DATASOURCE_DATABASE}
    volumes:
      - ./gateway-service/src/main/resources/init-database.sql:/docker-entrypoint-initdb.d/init-database.sql
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.0-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network